[project]
name = "eyegaze-inference"
version = "0.1.0"
description = "Eye gaze inference with GUI and custom weights"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.5",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
